openapi: 3.0.3
info:
  title: tupp API
  version: 1.4.2
  description: HTTP API exposed by `tupp serve`.

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /contacts:
    get:
      summary: List all contacts
      operationId: getContacts
      responses:
        "200":
          description: Contacts and groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TuppData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Create or update a contact
      description: Omit `identifier` to create a new contact, or provide it to update an existing one.
      operationId: postContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: updated
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                type: string
                format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /contacts/{id}:
    delete:
      summary: Delete a contact by ID
      operationId: deleteContact
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /groups:
    get:
      summary: List all groups
      operationId: getGroups
      responses:
        "200":
          description: Groups, with nested subgroups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Create a group
      description: Omit `parent` to create a top-level group, or provide a parent group ID to create a subgroup.
      operationId: postGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                parent:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                type: string
                format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Parent group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /groups/{id}:
    delete:
      summary: Delete a group by ID
      description: Also removes this group from any contact referencing it.
      operationId: deleteGroup
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /institutions:
    get:
      summary: List all institutions
      operationId: getInstitutions
      responses:
        "200":
          description: Institutions, with nested subinstitutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Institution"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Create an institution
      description: Omit `parent` to create a top-level institution, or provide a parent institution ID (at any depth) to create a sub-institution.
      operationId: postInstitution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                parent:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
          description: Institution created
          content:
            application/json:
              schema:
                type: string
                format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Parent institution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /institutions/{id}:
    delete:
      summary: Delete an institution by ID
      description: Deletes the institution and all its subinstitutions, and removes any contact position referencing any of them.
      operationId: deleteInstitution
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: deleted
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    TuppData:
      type: object
      required: [contacts, groups]
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        institutions:
          type: array
          items:
            $ref: "#/components/schemas/Institution"

    Contact:
      type: object
      required: [identity]
      properties:
        identifier:
          type: string
          format: uuid
        identity:
          $ref: "#/components/schemas/Identity"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        phones:
          type: array
          items:
            $ref: "#/components/schemas/PhoneNumber"
        socials:
          type: array
          items:
            $ref: "#/components/schemas/Social"
        groups:
          type: array
          items:
            type: string
            format: uuid
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    Identity:
      type: object
      properties:
        title:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        post_nominal:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
          enum: [male, female, non-binary]
        birth_date:
          $ref: "#/components/schemas/Date"
        birth_location:
          $ref: "#/components/schemas/Address"
        birth_first_name:
          type: string
          nullable: true
        birth_middle_name:
          type: string
          nullable: true
        birth_last_name:
          type: string
          nullable: true
        is_alive:
          type: boolean
          default: true
        death_date:
          $ref: "#/components/schemas/Date"
        death_location:
          $ref: "#/components/schemas/Address"

    Date:
      type: object
      properties:
        year:
          type: integer
          nullable: true
        month:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
        day:
          type: integer
          nullable: true
          minimum: 1
          maximum: 31
        hour:
          type: integer
          nullable: true
          minimum: 0
          maximum: 23
        minute:
          type: integer
          nullable: true
          minimum: 0
          maximum: 59
        second:
          type: integer
          nullable: true
          minimum: 0
          maximum: 59

    Address:
      type: object
      properties:
        label:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        post_code:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        number:
          type: string
          nullable: true

    Email:
      type: object
      properties:
        label:
          type: string
          nullable: true
        address:
          type: string
          format: email
          nullable: true

    PhoneNumber:
      type: object
      required: [country_code, number]
      properties:
        label:
          type: string
          nullable: true
        country_code:
          type: integer
        number:
          type: integer

    Social:
      type: object
      required: [network]
      properties:
        label:
          type: string
          nullable: true
        network:
          type: string
        username:
          type: string
          nullable: true

    Link:
      type: object
      required: [target, relation]
      properties:
        target:
          type: string
          format: uuid
        relation:
          type: string
          enum: [Friend, Child, Parent, Partner, Spouse, Ex]

    Group:
      type: object
      required: [identifier, name]
      properties:
        identifier:
          type: string
          format: uuid
        name:
          type: string
        subgroups:
          type: array
          items:
            $ref: "#/components/schemas/Group"

    Institution:
      type: object
      required: [identifier, name]
      properties:
        identifier:
          type: string
          format: uuid
        name:
          type: string
        subinstitutions:
          type: array
          items:
            $ref: "#/components/schemas/Institution"

    Tenure:
      description: 'Either the literal string "Present", or `{"Ended": <Date>}`.'
      oneOf:
        - type: string
          enum: [Present]
        - type: object
          required: [Ended]
          properties:
            Ended:
              $ref: "#/components/schemas/Date"

    Position:
      type: object
      required: [institution, title, tenure]
      properties:
        institution:
          type: string
          format: uuid
        title:
          type: string
        start:
          $ref: "#/components/schemas/Date"
        tenure:
          $ref: "#/components/schemas/Tenure"
